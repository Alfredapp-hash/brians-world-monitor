# The Public Dispatch — Netlify production for thepublicdispatch.com
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.api]
  timeout = 26

# /api/*, /mcp, /a2a, /ask, /oauth/* are served by netlify/functions/api.ts.
# Do not proxy them to Vercel or any foreign product origin.

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/embed"
  to = "/embed.html"
  status = 200

[[redirects]]
  from = "/osint4all"
  to = "/osint4all.html"
  status = 200

[[redirects]]
  from = "/pro"
  to = "/pro/index.html"
  status = 200

# Client-side app routes (Netlify still serves real files and functions first).
[[redirects]]
  from = "/*"
  to = "/dashboard.html"
  status = 200
