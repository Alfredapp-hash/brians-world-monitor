# The Public Dispatch — Netlify production for thepublicdispatch.com
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Same-origin /api on this host is proxied to the existing edge API so the
# SPA keeps relative /api/* calls. Browser traffic stays on Netlify.
[[redirects]]
  from = "/api/*"
  to = "https://brians-world-monitor.vercel.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/mcp"
  to = "https://brians-world-monitor.vercel.app/api/mcp"
  status = 200
  force = true

[[redirects]]
  from = "/a2a"
  to = "https://brians-world-monitor.vercel.app/api/a2a"
  status = 200
  force = true

[[redirects]]
  from = "/ask"
  to = "https://brians-world-monitor.vercel.app/api/ask"
  status = 200
  force = true

[[redirects]]
  from = "/oauth/*"
  to = "https://brians-world-monitor.vercel.app/oauth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/embed"
  to = "/embed.html"
  status = 200

[[redirects]]
  from = "/pro"
  to = "/pro/index.html"
  status = 200

# Client-side app routes (Netlify still serves real files in dist first).
[[redirects]]
  from = "/*"
  to = "/dashboard.html"
  status = 200
